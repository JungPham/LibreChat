# Do not edit this file directly. Use a ‘docker-compose.override.yaml’ file if you can.
# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:
  api:
    container_name: LibreChat
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongodb
      - rag_api
    image: registry.librechat.ai/librechat-ai/librechat-dev:latest
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - LIBRECHAT_TEMP_CREDENTIALS_PATH=/app/data/.env.temp
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,chat-mongodb,meilisearch,chat-meilisearch,rag_api,vectordb,host.docker.internal
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - ./images:/app/client/public/images
      - ./librechat.yaml:/app/librechat.yaml
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./skill:/app/skill
      - librechat-data:/app/data
  admin-panel:
    container_name: admin-panel
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    ports:
      - "${ADMIN_PANEL_PORT:-3000}:3000"
    depends_on:
      - api
    restart: always
    environment:
      - PORT=3000
      # Plain expansion (not :?) so `docker compose down`/`pull` still run when this is unset.
      # The panel itself refuses to start without it; set ADMIN_PANEL_SESSION_SECRET in .env.
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:${PORT:-3080}
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost:3080}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
  mongodb:
    container_name: chat-mongodb
    image: mongo:8.0.20
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.35.1:/meili_data
  vectordb:
    container_name: vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
  rag_api:
    container_name: rag_api
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

  litellm:
    image: ghcr.io/berriai/litellm:1.101.0
    container_name: litellm
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    environment:
      GEMINI_API_KEY1: "REPLACE_ME"
      GEMINI_API_KEY2: "REPLACE_ME"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  mcp-office-docs:
    image: georgx22/mcp-office-docs:latest
    container_name: mcp-office-docs
    restart: always
    ports:
      - "8958:8958"
    volumes:
      # Local output directory (used by LOCAL strategy)
      - ./output:/app/output
      # Custom Office templates (optional): custom_pptx_template_4_3.pptx, custom_pptx_template_16_9.pptx,
      # custom_docx_template.docx, custom_email_template.html — plus any .pptx/.potx registered in
      # config/pptx_templates.yaml. Both directories are re-read when they change, no restart needed.
      - ./custom_templates:/app/custom_templates
      # Config directory containing:
      #   - email_templates.yaml (dynamic email tool definitions – Mustache templates)
      #   - docx_templates.yaml (dynamic Word tool definitions)
      #   - pptx_templates.yaml (optional: register named PowerPoint templates)
      #   - credentials or other configuration files (e.g., GCS service account JSON)
      - ./config:/app/config

  google-workspace-mcp:
    container_name: google-workspace-mcp
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:1.27.1
    restart: unless-stopped

    environment:
      MCP_ENABLE_OAUTH21: "false"
      GOOGLE_OAUTH_CLIENT_ID: "REPLACE_ME"
      GOOGLE_OAUTH_CLIENT_SECRET: "REPLACE_ME"

      WORKSPACE_MCP_HOST: "0.0.0.0"
      WORKSPACE_MCP_PORT: "8000"
      GOOGLE_OAUTH_REDIRECT_URI: "http://localhost:18000/oauth2callback"
      OAUTHLIB_INSECURE_TRANSPORT: "1"

      TOOLS: "gmail drive calendar slides"

      GOOGLE_MCP_CREDENTIALS_DIR: "/app/store_creds"

      ALLOWED_FILE_DIRS: "/app/output"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - google_workspace_credentials:/app/store_creds
      - ./output:/app/output:ro
    ports:
      - "127.0.0.1:18000:8000"

volumes:
  pgdata2:
  librechat-data:
  data-node:
  google_workspace_credentials:
